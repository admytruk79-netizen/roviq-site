name: Deploy ROVIQ Worker

on:
  push:
    branches: [main]
  workflow_dispatch: {}

concurrency:
  group: roviq-production
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - run: npm ci

      - name: Verify Cloudflare token
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ]; then
            echo "::error::Missing CLOUDFLARE_API_TOKEN repository secret."
            exit 1
          fi

      - name: Patch mileage parser regression
        run: |
          node - <<'NODE'
          const fs=require('fs');
          const path='src/inventory.js';
          let s=fs.readFileSync(path,'utf8');
          const replacements=[
            [
              'const INVENTORY_SCHEMA_VERSION = 31; // Accept low-mileage new vehicles in live inventory',
              'const INVENTORY_SCHEMA_VERSION = 32; // Preserve dealer-reported mileage; remove forced-zero fallbacks'
            ],
            [
              'const mileageMi=usedMileage!=null ? usedMileage : (isUsed ? null : 0);',
              'const mileageMi=usedMileage;'
            ],
            [
              'const newVehicleUrl=/(?:\\/new[-\\/]|\\/inventory\\/new-)/i.test(url);\n    const hintMileage=parsedHintMileage!=null ? parsedHintMileage : (newVehicleUrl ? 0 : null);',
              'const hintMileage=parsedHintMileage;'
            ],
            [
              'const hinted={...prior,...item.hints};',
              'const hinted={...prior,...item.hints};\n          if(item.hints?.mileageMi==null && prior.mileageMi===0) hinted.mileageMi=null;'
            ],
            [
              'mileageMi:Number.isFinite(Number(v.mileageMi))?Number(v.mileageMi):0,',
              'mileageMi:v.mileageMi==null?null:Number(v.mileageMi),'
            ]
          ];
          for (const [from,to] of replacements) {
            if (!s.includes(from)) throw new Error('Mileage hotfix pattern not found: '+from.slice(0,80));
            s=s.replace(from,to);
          }
          fs.writeFileSync(path,s);
          NODE

      - name: Rebuild live inventory mileage
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: node scripts/sync-inventory.mjs

      - name: Deploy with Wrangler
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: npx wrangler deploy

      - name: Verify live vehicle inventory
        run: |
          set -euo pipefail
          BASE="https://roviq-site.admytruk79.workers.dev"
          sleep 6
          curl -fsS --retry 4 --retry-delay 3 --max-time 120 "$BASE/api/inventory-health" -o /tmp/health.json
          curl -fsS --retry 4 --retry-delay 3 --max-time 60 "$BASE/api/vehicles" -o /tmp/vehicles.json
          node - <<'NODE'
          const fs=require("fs");
          const health=JSON.parse(fs.readFileSync("/tmp/health.json","utf8"));
          const inventory=JSON.parse(fs.readFileSync("/tmp/vehicles.json","utf8"));
          const vehicles=Array.isArray(inventory.vehicles)?inventory.vehicles:[];
          const zeroMileage=vehicles.filter(v=>v.mileageMi===0);
          const summary={
            inventoryVersion:inventory.version||null,
            healthVersion:health.version||null,
            syncedAt:inventory.syncedAt||health.syncedAt||null,
            databaseRows:Number(inventory.databaseRows||0),
            publicVehicles:vehicles.length,
            zeroMileageVehicles:zeroMileage.length,
            candidateCap:Number(inventory.candidateCap||0),
            healthCounts:health.counts||null,
            sources:Array.isArray(health.sources)?health.sources.map(s=>({
              id:s.id,healthy:s.healthy,discovered:s.discovered,
              availableVehicles:s.availableVehicles,publicReadyVehicles:s.publicReadyVehicles
            })):[],
            samples:vehicles.slice(0,5).map(v=>({
              id:v.id,year:v.year,make:v.make,model:v.model,trim:v.trim,
              mileageMi:v.mileageMi,hasPrice:Boolean(v.pricing?.hasPrice)
            }))
          };
          console.log(JSON.stringify(summary,null,2));
          if(!summary.syncedAt) throw new Error("Live inventory has no sync timestamp");
          if(summary.databaseRows<1) throw new Error("Live inventory database is empty");
          if(vehicles.length<1) throw new Error("No public live vehicles returned");
          if(zeroMileage.length>0) throw new Error("Forced zero mileage still present in live inventory");
          NODE
