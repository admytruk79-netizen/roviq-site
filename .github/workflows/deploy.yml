name: Deploy ROVIQ Worker

on:
  push:
    branches: [main]
  workflow_dispatch: {}

concurrency:
  group: roviq-production
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - run: npm ci

      - name: Verify Cloudflare token
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ]; then
            echo "::error::Missing CLOUDFLARE_API_TOKEN repository secret."
            exit 1
          fi

      - name: Deploy with Wrangler
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: npx wrangler deploy

      - name: Verify live vehicle inventory
        run: |
          set -euo pipefail
          BASE="https://roviq-site.admytruk79.workers.dev"
          sleep 6
          curl -fsS --retry 4 --retry-delay 3 --max-time 120 "$BASE/api/inventory-health" -o /tmp/health.json
          curl -fsS --retry 4 --retry-delay 3 --max-time 60 "$BASE/api/vehicles" -o /tmp/vehicles.json
          node - <<'NODE'
          const fs=require("fs");
          const health=JSON.parse(fs.readFileSync("/tmp/health.json","utf8"));
          const inventory=JSON.parse(fs.readFileSync("/tmp/vehicles.json","utf8"));
          const vehicles=Array.isArray(inventory.vehicles)?inventory.vehicles:[];
          const summary={
            inventoryVersion:inventory.version||null,
            healthVersion:health.version||null,
            syncedAt:inventory.syncedAt||health.syncedAt||null,
            databaseRows:Number(inventory.databaseRows||0),
            publicVehicles:vehicles.length,
            candidateCap:Number(inventory.candidateCap||0),
            healthCounts:health.counts||null,
            sources:Array.isArray(health.sources)?health.sources.map(s=>({
              id:s.id,healthy:s.healthy,discovered:s.discovered,
              availableVehicles:s.availableVehicles,publicReadyVehicles:s.publicReadyVehicles
            })):[],
            samples:vehicles.slice(0,5).map(v=>({
              id:v.id,year:v.year,make:v.make,model:v.model,trim:v.trim,
              mileageMi:v.mileageMi,hasPrice:Boolean(v.pricing?.hasPrice)
            }))
          };
          console.log(JSON.stringify(summary,null,2));
          if(!summary.syncedAt) throw new Error("Live inventory has no sync timestamp");
          if(summary.databaseRows<1) throw new Error("Live inventory database is empty");
          if(vehicles.length<1) throw new Error("No public live vehicles returned");
          NODE
