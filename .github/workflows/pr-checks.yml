name: Site PR checks

on:
  pull_request:
    branches: [main]

jobs:
  verify:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: node --test src/inventory.test.mjs scripts/core-inventory-feed.test.mjs
      - run: node build-check.js
      - run: npx wrangler deploy --dry-run
      - name: Probe live dealer search sources (informational)
        continue-on-error: true
        run: node scripts/probe-search-sources.mjs
      - name: Probe ROVIQ Core new trucks (informational)
        continue-on-error: true
        run: node --input-type=module -e "import('./src/new-trucks.js').then(async m=>{const r=await m.getNewTrucks(new URLSearchParams(),fetch,null);console.log('new trucks from Core:',r.vehicles.length,'of',r.total);for(const v of r.vehicles.slice(0,5))console.log(' ',v.year,v.make,v.model,v.trim,'$'+v.price,v.vin,v.image?'photo':'no photo')})"
