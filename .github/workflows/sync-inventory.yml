name: Refresh vehicle inventory
on:
  schedule:
    - cron: '17 * * * *'
  workflow_dispatch: {}
concurrency:
  group: roviq-inventory-sync
  cancel-in-progress: false
jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Fetch and publish verified dealer inventory
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: node scripts/sync-inventory.mjs
      - name: Check customer endpoint
        run: |
          curl -fsS --retry 3 --retry-delay 3 --max-time 60 https://roviq-site.admytruk79.workers.dev/api/vehicles -o /tmp/vehicles.json
          node -e 'const x=require("/tmp/vehicles.json"); console.log(`Public vehicles: ${x.vehicles.length}; database rows: ${x.databaseRows}`); if(x.vehicles.length<10) process.exit(1)'
